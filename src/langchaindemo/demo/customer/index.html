<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商客服反馈处理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #1f2329;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container { max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }
        header { text-align: center; margin-bottom: 28px; }
        header h1 { font-size: 26px; color: #1f2329; }
        header p { margin-top: 8px; color: #646a73; font-size: 14px; }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: #3370ff; }

        textarea {
            width: 100%;
            min-height: 110px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            resize: vertical;
            font-family: inherit;
            transition: border-color .2s;
        }
        textarea:focus { outline: none; border-color: #3370ff; }

        .toolbar { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .btn {
            border: none;
            border-radius: 8px;
            padding: 9px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all .2s;
        }
        .btn-primary { background: #3370ff; color: #fff; }
        .btn-primary:hover { background: #245bdb; }
        .btn-primary:disabled { background: #a0c0ff; cursor: not-allowed; }
        .btn-ghost { background: #f5f6f8; color: #4e5969; }
        .btn-ghost:hover { background: #e5e6eb; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .stat {
            background: #fafbfc;
            border: 1px solid #eff0f3;
            border-radius: 10px;
            padding: 14px;
        }
        .stat .label { font-size: 13px; color: #86909c; margin-bottom: 6px; }
        .stat .value { font-size: 15px; font-weight: 600; word-break: break-all; }
        .stat .sub { font-size: 12px; color: #86909c; margin-top: 4px; }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .badge-POSITIVE { background: #e8ffea; color: #0e8a3e; }
        .badge-NEGATIVE { background: #ffece8; color: #d0243e; }
        .badge-NEUTRAL { background: #eef0f3; color: #4e5969; }
        .badge-HIGH { background: #ffece8; color: #d0243e; }
        .badge-MEDIUM { background: #fff7e8; color: #d25f00; }
        .badge-LOW { background: #e8ffea; color: #0e8a3e; }

        .chip {
            display: inline-block;
            background: #eff3ff;
            color: #3370ff;
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 13px;
            margin: 0 6px 6px 0;
        }
        .meta-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; color: #646a73; }

        .response-box {
            background: #f7f8fa;
            border-left: 4px solid #3370ff;
            border-radius: 6px;
            padding: 16px;
            font-size: 14px;
            white-space: pre-wrap;
        }
        .response-box .urgent-flag {
            color: #d0243e;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .hidden { display: none; }
        .loading { text-align: center; color: #86909c; font-size: 14px; padding: 20px 0; }
        .spinner {
            display: inline-block;
            width: 22px; height: 22px;
            border: 3px solid #e5e6eb;
            border-top-color: #3370ff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-box {
            background: #ffece8;
            color: #d0243e;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
        }
        .error-box .detail { font-size: 12px; color: #a02639; margin-top: 4px; word-break: break-all; }

        @media (max-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>电商客服反馈处理系统</h1>
        <p>自动完成情感分析、问题分类、紧急程度评估并生成回复草稿</p>
    </header>

    <!-- 输入区 -->
    <div class="card">
        <h2><span class="dot"></span>客户反馈内容</h2>
        <textarea id="feedback" placeholder="请输入客户反馈内容，例如：我昨天下的订单ORD2026081416，说好三天到货结果一周还没收到，非常生气！要求立刻处理！"></textarea>
        <div class="toolbar">
            <button class="btn btn-primary" id="submitBtn">提交分析</button>
            <button class="btn btn-ghost" id="exampleBtn">填入示例</button>
            <div class="meta-row" style="margin-left:auto; align-self:center; margin-bottom:0;">
                <span id="statusText" style="color:#86909c; font-size:13px;"></span>
            </div>
        </div>
    </div>

    <!-- 加载中 -->
    <div class="card hidden" id="loadingCard">
        <div class="loading"><span class="spinner"></span>正在分析反馈，请稍候...</div>
    </div>

    <!-- 错误提示 -->
    <div class="card hidden" id="errorCard">
        <div class="error-box" id="errorText"></div>
    </div>

    <!-- 分析结果 -->
    <div id="resultSection" class="hidden">
        <div class="card">
            <h2><span class="dot"></span>分析结果</h2>
            <div class="grid">
                <div class="stat">
                    <div class="label">情感倾向</div>
                    <div class="value"><span class="badge" id="sentiment"></span></div>
                    <div class="sub" id="confidence"></div>
                </div>
                <div class="stat">
                    <div class="label">问题分类</div>
                    <div class="value" id="categories"></div>
                </div>
                <div class="stat">
                    <div class="label">紧急程度</div>
                    <div class="value"><span class="badge" id="urgency"></span></div>
                    <div class="sub" id="sla"></div>
                </div>
            </div>
            <div style="margin-top:14px;">
                <div class="label" style="font-size:13px; color:#86909c; margin-bottom:6px;">订单ID</div>
                <div class="value" id="orderId" style="font-size:15px; font-weight:600;"></div>
            </div>
            <div style="margin-top:14px;">
                <div class="label" style="font-size:13px; color:#86909c; margin-bottom:6px;">关键要点</div>
                <div id="keyPhrases"></div>
            </div>
            <div class="meta-row" style="margin-top:14px;">
                <span>处理耗时：<span id="processTime"></span> 秒</span>
                <span>分配团队：<span id="assignedTeam"></span></span>
            </div>
        </div>

        <div class="card">
            <h2><span class="dot"></span>回复草稿</h2>
            <div class="response-box" id="finalResponse"></div>
        </div>
    </div>
</div>

<script>
    const $ = (id) => document.getElementById(id);

    // 示例反馈
    const EXAMPLE =
        "我昨天下的订单ORD2026081416，承诺三天到货，结果一周过去了还没收到。" +
        "物流信息一直停留在“已发货”状态，客服也联系不上，非常生气！" +
        "如果再不给处理方案，我就要去投诉了，请立刻解决！";

    const SENTIMENT_TEXT = { POSITIVE: "积极", NEUTRAL: "中性", NEGATIVE: "消极" };
    const URGENCY_TEXT = { HIGH: "高", MEDIUM: "中", LOW: "低" };

    function setLoading(loading) {
        $("submitBtn").disabled = loading;
        $("loadingCard").classList.toggle("hidden", !loading);
        $("statusText").textContent = loading ? "处理中..." : "";
    }

    function renderResult(data) {
        $("resultSection").classList.remove("hidden");
        const payload = data.result;          // generate_response 的返回
        const result = payload.result || {};  // 分析数据（嵌套在 payload.result 中）

        // 情感分析
        const sentiment = result.sentiment || "NEUTRAL";
        $("sentiment").textContent = SENTIMENT_TEXT[sentiment] || sentiment;
        $("sentiment").className = "badge badge-" + sentiment;
        const confidence = result.confidence;
        $("confidence").textContent = "置信度：" +
            (typeof confidence === "number" ? confidence.toFixed(2) : "-");

        // 问题分类
        const categories = Array.isArray(result.categories) ? result.categories : [result.categories];
        $("categories").innerHTML = categories
            .map((c) => '<span class="chip">' + c + "</span>")
            .join("");

        // 紧急程度
        const urgency = result.urgency || "MEDIUM";
        $("urgency").textContent = URGENCY_TEXT[urgency] || urgency;
        $("urgency").className = "badge badge-" + urgency;
        $("sla").textContent = "响应时限：" + (result.sla_hours ?? "-") + " 小时" +
            (result.urgency_reason ? " · " + result.urgency_reason : "");

        // 订单ID
        $("orderId").textContent = result.order_id || "NOT_FOUND";

        // 关键要点
        $("keyPhrases").innerHTML = (result.key_phrases && result.key_phrases.length)
            ? result.key_phrases.map((p) => '<span class="chip">' + p + "</span>").join("")
            : '<span style="color:#86909c; font-size:13px;">未提取到关键要点</span>';

        // 元信息
        $("processTime").textContent = data.process_time ? data.process_time.toFixed(3) : "-";
        $("assignedTeam").textContent = payload.assigned_team || "General";

        // 回复草稿
        let responseText = payload.final_response || "";
        const isUrgent = /^\[紧急\]/.test(responseText);
        if (isUrgent) {
            responseText = responseText.replace(/^\[紧急\]\s*/, "");
        }
        $("finalResponse").innerHTML =
            (isUrgent ? '<div class="urgent-flag">[紧急]</div>' : "") +
            "<div>" + escapeHtml(responseText) + "</div>";
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, (ch) => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;",
            '"': "&quot;", "'": "&#39;",
        }[ch]));
    }

    async function submitFeedback() {
        const content = $("feedback").value.trim();
        if (!content) {
            $("statusText").textContent = "请输入反馈内容";
            return;
        }

        // 清空上一次结果和错误
        $("resultSection").classList.add("hidden");
        $("errorCard").classList.add("hidden");
        setLoading(true);

        try {
            const resp = await fetch("/process-feedback", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: content, user_id: "web-user" }),
            });
            const data = await resp.json();
            if (!resp.ok || data.success !== true) {
                throw new Error(data.detail || "处理失败");
            }
            renderResult(data);
        } catch (err) {
            $("errorCard").classList.remove("hidden");
            $("errorText").innerHTML =
                "<div>请求失败：" + escapeHtml(err.message) + "</div>" +
                '<div class="detail">请确认后端服务已启动，且模型服务可用。</div>';
        } finally {
            setLoading(false);
            $("statusText").textContent = "";
        }
    }

    $("submitBtn").addEventListener("click", submitFeedback);
    $("exampleBtn").addEventListener("click", () => {
        $("feedback").value = EXAMPLE;
    });
    $("feedback").addEventListener("keydown", (e) => {
        if (e.ctrlKey && e.key === "Enter") submitFeedback();
    });
</script>
</body>
</html>
